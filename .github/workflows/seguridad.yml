# DES-9 (complemento de ci.yml): secretos en el historial y dependencias vulnerables.
# Va aparte para no tocar ci.yml del equipo de desarrollo. Marcar ambos checks como obligatorios
# en Settings > Rules junto con "Compilar y probar".
name: Seguridad

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  secretos:
    name: Buscar secretos en el historial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source /repo --redact --verbose --log-opts="HEAD"

  dependencias:
    name: Dependencias vulnerables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Sin "cache: maven" a proposito: la clave seria la misma que la de ci.yml, y este job, que solo baja pom,
      # guardaria primero una cache incompleta que ci.yml reutilizaria sin los jar.
      # trivy lee las dependencias transitivas (Jackson, Tomcat...) de los pom que haya en ~/.m2. En un runner
      # nuevo no hay ninguno y solo ve las directas: el escaneo salia limpio con 5 CVE altas de Jackson. Resolver
      # el arbol baja esos pom (no compila ni corre pruebas).
      - name: Resolver las dependencias para trivy
        run: |
          chmod +x mvnw docs/ejemplo-jwt/mvnw
          ./mvnw -B -q dependency:tree -DoutputFile=target/arbol.txt
          ./docs/ejemplo-jwt/mvnw -B -q -f docs/ejemplo-jwt/pom.xml dependency:tree -DoutputFile=target/arbol.txt
      - name: trivy (HIGH y CRITICAL con parche disponible)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
