# Solo produccion, activado expresamente junto con prod durante la ventana aprobada.
# La membresia del migrador no sustituye SET ROLE en cada conexion de Flyway.
spring.flyway.init-sqls=SET ROLE tramites_prod_owner
spring.flyway.schemas=tramites
spring.flyway.default-schema=tramites
spring.flyway.create-schemas=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration,classpath:db/produccion
spring.jpa.properties.hibernate.default_schema=tramites
